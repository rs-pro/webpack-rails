# GitLab CI configuration for rs-webpack-rails gem
# Tests Rails 7/8 + Webpack 5 integration with multiple Ruby versions

image: ruby:3.4-bookworm

variables:
  RAILS_ENV: test
  BUNDLE_PATH: vendor/bundle
  BUNDLE_JOBS: 4
  BUNDLE_RETRY: 3
  DISABLE_SPRING: 1

# Cache gems and npm packages between jobs
cache:
  key:
    files:
      - Gemfile.lock
      - spec/dummy/package-lock.json
  paths:
    - vendor/bundle
    - spec/dummy/node_modules
    - .npm

stages:
  - setup
  - test
  - quality
  - deploy

# Template for Ruby + Node.js setup
.ruby_node_template:
  before_script:
    # Install system dependencies
    - apt-get update -qq && apt-get install -y curl wget gnupg unzip
    # Install Chrome for browser tests
    - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
    - apt-get update -qq && apt-get install -y google-chrome-stable
    - export CHROME_PATH=/usr/bin/google-chrome-stable
    # Install Node.js 20 LTS
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version
    - npm --version
    # Install bundler and gems
    - gem install bundler --no-document
    - bundle config set --local path 'vendor/bundle'
    - bundle config set --local without 'development'
    - bundle install --jobs ${BUNDLE_JOBS}

# Setup job - ensures dependencies are cached
setup:dependencies:
  extends: .ruby_node_template
  stage: setup
  script:
    - bundle check || bundle install
    - cd spec/dummy && npm install
    - echo "Dependencies installed successfully"
  cache:
    policy: pull-push
  artifacts:
    paths:
      - vendor/bundle
      - spec/dummy/node_modules
    expire_in: 1 hour

# Test job template
.test_template:
  extends: .ruby_node_template
  stage: test
  needs: ["setup:dependencies"]
  script:
    - cd spec/dummy
    - npm run build || echo "No build script, skipping webpack compilation"
    - cd ../..
    - bundle exec rspec --format progress --format RspecJunitFormatter --out rspec.xml
  coverage: '/\(\d+.\d+\%\) covered/'
  artifacts:
    reports:
      junit: rspec.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/
      - rspec.xml
    expire_in: 1 week
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Test with Ruby 3.3
test:ruby-3.3:
  extends: .test_template
  image: ruby:3.3-bookworm

# Test with Ruby 3.4
test:ruby-3.4:
  extends: .test_template
  image: ruby:3.4-bookworm

# Test webpack compilation
test:webpack-compile:
  extends: .ruby_node_template
  stage: test
  needs: ["setup:dependencies"]
  script:
    - cd spec/dummy
    - npm run build
    - echo "Checking compiled assets..."
    - ls -la public/webpack/
    - |
      if ls public/webpack/*.digested.js 1> /dev/null 2>&1; then
        echo "✓ Digested assets found"
      else
        echo "✗ No .digested.js files found!"
        exit 1
      fi
  artifacts:
    paths:
      - spec/dummy/public/webpack/
    expire_in: 1 day

# Test generator
test:generator:
  extends: .ruby_node_template
  stage: test
  needs: ["setup:dependencies"]
  script:
    # Create temporary Rails app
    - gem install rails --version ">= 7.0" --no-document
    - rails new /tmp/test_app --skip-bundle --skip-git --asset-pipeline=propshaft
    - cd /tmp/test_app
    # Add gem from current source
    - bash $CI_PROJECT_DIR/.ci/add_gem_to_gemfile.sh
    - bundle install
    # Run generator
    - bundle exec rails generate webpack_rails:install --skip-bundle --skip-npm-install
    # Verify files were created
    - test -f config/webpack.config.js || (echo "webpack.config.js not created" && exit 1)
    - test -f package.json || (echo "package.json not created" && exit 1)
    - test -f Procfile || (echo "Procfile not created" && exit 1)
    - test -d webpack || (echo "webpack directory not created" && exit 1)
    - test -f webpack/application.js || (echo "webpack/application.js not created" && exit 1)
    - echo "✓ Generator test passed"

# Test with Rails 7.x specifically (optional)
test:rails-7:
  extends: .test_template
  image: ruby:3.3-bookworm
  needs:
    - job: setup:dependencies
      optional: true
  before_script:
    - !reference [.ruby_node_template, before_script]
    - bundle config set --local gemfile 'Gemfile'
    - echo "gem 'rails', '~> 7.0'" >> Gemfile
    - bundle install --jobs ${BUNDLE_JOBS}
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Test with Rails 8.x specifically (optional)
test:rails-8:
  extends: .test_template
  image: ruby:3.4-bookworm
  needs:
    - job: setup:dependencies
      optional: true
  before_script:
    - !reference [.ruby_node_template, before_script]
    - bundle exec rails --version
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# RuboCop linting
quality:rubocop:
  extends: .ruby_node_template
  stage: quality
  needs: ["setup:dependencies"]
  script:
    - bundle exec rubocop --format progress --format json --out rubocop.json || true
  artifacts:
    paths:
      - rubocop.json
    expire_in: 1 week
  allow_failure: true

# Security audit
quality:bundle-audit:
  image: ruby:3.4-bookworm
  stage: quality
  before_script:
    - gem install bundler-audit --no-document
  script:
    - bundler-audit check --update
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Deploy coverage to GitLab Pages
pages:
  stage: deploy
  needs: ["test:ruby-3.4"]
  script:
    - mkdir -p public
    - cp -r coverage public/ || echo "No coverage directory"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Build and release gem on tags
release:gem:
  image: ruby:3.4-bookworm
  stage: deploy
  needs: ["test:ruby-3.3", "test:ruby-3.4"]
  before_script:
    - gem install bundler --no-document
  script:
    - echo "Building gem version $(ruby -r ./lib/webpack/rails/version.rb -e 'puts Webpack::Rails::VERSION')"
    - gem build rs-webpack-rails.gemspec
    - ls -lh *.gem
    # Uncomment to push to RubyGems (requires RUBYGEMS_API_KEY variable)
    # - |
    #   if [ -n "$RUBYGEMS_API_KEY" ]; then
    #     mkdir -p ~/.gem
    #     echo ":rubygems_api_key: ${RUBYGEMS_API_KEY}" > ~/.gem/credentials
    #     chmod 0600 ~/.gem/credentials
    #     gem push *.gem
    #   fi
  artifacts:
    paths:
      - "*.gem"
    expire_in: 1 month
  rules:
    - if: '$CI_COMMIT_TAG'